[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexbridge"
version = "0.1.0"
description = "Time-aware retrieval over India's old and new criminal codes: the right section for the date of the offence, cited, or no answer at all."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TEJAS", email = "tejasdeshmane66@gmail.com" }]
keywords = ["rag", "retrieval", "legal", "ipc", "bns", "india"]

# Pinned exactly. An ablation table is only evidence if the numbers in it can be
# reproduced, and an unpinned dependency is the easiest way to lose that.
dependencies = [
    "pydantic==2.14.1",
    # Not PyMuPDF: it is AGPL, and this ships as a network service. See
    # docs/decisions/0001-pdfplumber-not-pymupdf.md.
    "pdfplumber==0.11.10",
    "numpy==2.4.6",
    # Dense retrieval. Models run on CPU: ~940 sections embed in minutes, and serving
    # embeds one short query per request. CI installs the CPU-only torch wheel first
    # (see .github/workflows/ci.yml); the default Linux wheel bundles CUDA.
    "sentence-transformers==6.1.0",
    "torch==2.14.1",
    # LLM calls. Groq and Gemini both speak the OpenAI chat-completions shape, so one
    # HTTP client replaces two vendor SDKs.
    "httpx==0.28.1",
    # The API. Plain uvicorn, not [standard]: the model call dominates a request's
    # latency, so uvloop/httptools would buy little for six more packages. starlette is
    # pinned too because the API's behaviour depends on it directly.
    "fastapi==0.150.0",
    "starlette==1.9.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.2",
    "pyright==1.1.411",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lexbridge = ["py.typed", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests download the real statute PDFs from government sites, so they are
# opt-in: `pytest` stays fast and offline, `pytest -m integration` runs the real thing.
addopts = "-q -m 'not integration'"
markers = [
    "integration: downloads and parses the real statute PDFs (needs network)",
]
# Warnings are failures. A deprecation warning is how a silent behaviour change
# announces itself a release before it breaks something.
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["lexbridge"]
omit = ["*/__pycache__/*", "*/tests/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes — real bugs: unused names, undefined vars
    "I",    # isort — import ordering
    "N",    # pep8-naming
    "UP",   # pyupgrade — modern syntax
    "B",    # flake8-bugbear — likely bugs, e.g. mutable default args
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["lexbridge"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
