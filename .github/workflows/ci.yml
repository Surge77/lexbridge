name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight run when the same branch is pushed again. This is a private repo,
# so Actions minutes are metered.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Lint only, not `ruff format`: the formatter would reflow the statute text kept
      # in test fixtures, and those fixtures must match the PDFs byte for byte.
      - name: Lint
        run: ruff check .

      # Fully offline — tests/conftest.py fails any unmarked test that opens a
      # non-loopback socket.
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

      - name: Types
        run: pyright
