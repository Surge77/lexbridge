name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight run when the same branch is pushed again. This is a private repo,
# so Actions minutes are metered.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # CPU torch first, from PyTorch's own index, so the next line finds it satisfied
      # instead of pulling the multi-gigabyte CUDA build from PyPI. Keep the version in
      # step with pyproject.toml.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      # Lint only, not `ruff format`: the formatter would reflow the statute text kept
      # in test fixtures, and those fixtures must match the PDFs byte for byte.
      - name: Lint
        run: ruff check .

      # Fully offline — tests/conftest.py fails any unmarked test that opens a
      # non-loopback socket.
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

      - name: Types
        run: pyright

  web:
    name: web page
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm run coverage
      # The built page is committed into the Python package so pip installs and the image
      # need no Node. This fails when someone changes web/ without rebuilding.
      - name: Built page is up to date
        run: |
          npm run build
          git diff --exit-code -- ../src/lexbridge/api/static

  real-sources:
    name: real statute PDFs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      # Keyed on the manifest, not the code: what is cached is the downloaded PDFs, and
      # those change only when data/sources.json pins different bytes. Government hosts
      # are slow and intermittently 504, so a warm cache also keeps this job reliable.
      - name: Cache the PDFs
        uses: actions/cache@v4
        with:
          path: data/raw
          key: statutes-${{ hashFiles('data/sources.json') }}

      # The correctness gates: section coverage for all three texts, plus the 2013/2018
      # IPC inserts that prove the source is the last amended text.
      - name: Parse the real PDFs
        run: pytest -m integration -q
